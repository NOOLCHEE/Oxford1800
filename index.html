<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 스마트 1800 영단어장 & 퀴즈 보드</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --primary-soft: #ccfbf1;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #17302f;
            --text-light: #66807d;
            --border: #dce8e5;
            --success: #15803d;
            --error: #dc2626;
            --shadow: 0 12px 30px rgba(22, 67, 62, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(145deg, #edf8f5 0%, var(--bg) 35%, #f8faf9 100%); color: var(--text); font-family: 'Pretendard', 'Noto Sans KR', sans-serif; min-height: 100vh; padding: clamp(18px, 4vw, 48px) 16px; }
        button, input, select { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        .container { max-width: 1080px; width: 100%; margin: 0 auto; }
        
        header { margin: 0 auto 28px; max-width: 680px; }
        header h1 { color: var(--text); font-size: clamp(1.75rem, 4vw, 2.6rem); letter-spacing: -0.04em; line-height: 1.15; margin-bottom: 10px; }
        header h1::first-letter { color: var(--primary); }
        header p { color: var(--text-light); font-size: 0.95rem; line-height: 1.6; }
        
        /* 탭 메뉴 */
        .tabs { display: flex; gap: 6px; margin-bottom: 16px; padding: 5px; background: rgba(255, 255, 255, 0.72); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 4px 12px rgba(22, 67, 62, 0.04); }
        .tab-btn { flex: 1; min-height: 46px; padding: 10px 14px; border: none; background: transparent; color: var(--text-light); cursor: pointer; border-radius: 10px; font-size: 0.95rem; font-weight: 700; transition: background 0.2s, color 0.2s, box-shadow 0.2s; }
        .tab-btn:hover { color: var(--primary); }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 5px 12px rgba(15, 118, 110, 0.2); }

        /* 필터 섹션 */
        .filter-section { display: grid; grid-template-columns: 1fr 1fr minmax(220px, 2fr); gap: 10px; margin-bottom: 22px; }
        select, input { min-width: 0; padding: 12px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.92rem; outline: none; transition: border 0.2s, box-shadow 0.2s; }
        select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
        .search-input { width: 100%; }

        .view-panel { display: none; width: 100%; }
        .view-panel.active { display: block; }

        /* 단어장 스타일 */
        .word-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
        .word-card { background: var(--card-bg); padding: 18px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(22, 67, 62, 0.04); position: relative; transition: transform 0.2s, box-shadow 0.2s; }
        .word-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
        .word-title { font-size: 1.28rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); overflow-wrap: anywhere; }
        .badge { flex: 0 0 auto; font-size: 0.7rem; padding: 4px 8px; border-radius: 20px; font-weight: 700; background: #edf3f1; color: var(--text-light); }
        .badge.hard { background: #fee2e2; color: var(--error); }
        .word-meaning { min-height: 24px; color: var(--text-light); font-size: 0.95rem; line-height: 1.5; margin-bottom: 14px; overflow-wrap: anywhere; }
        .audio-btn { background: var(--primary-soft); border: none; color: var(--primary-hover); padding: 8px 11px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 700; transition: background 0.2s; }
        .audio-btn:hover { background: #99f6e4; }

        /* 퀴즈 스타일 */
        .quiz-card { background: var(--card-bg); padding: clamp(24px, 6vw, 52px); border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); text-align: center; }
        .quiz-progress { display: inline-block; padding: 5px 10px; background: #edf3f1; border-radius: 20px; font-size: 0.8rem; font-weight: 700; color: var(--text-light); margin-bottom: 22px; }
        .quiz-question { font-size: clamp(1.6rem, 5vw, 2.35rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1.25; margin-bottom: 28px; color: var(--text); overflow-wrap: anywhere; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 auto 20px; max-width: 680px; }
        .option-btn { min-height: 58px; padding: 13px 15px; border: 1px solid var(--border); background: var(--card-bg); border-radius: 10px; color: var(--text); font-size: 1rem; cursor: pointer; transition: background 0.2s, border 0.2s, transform 0.2s; font-weight: 600; overflow-wrap: anywhere; }
        .option-btn:hover { background: #f0fdfa; border-color: var(--primary); transform: translateY(-1px); }
        
        /* 주관식 입력 */
        .subjective-container { display: flex; flex-direction: column; gap: 12px; max-width: 400px; margin: 0 auto 20px; }
        .subjective-input { width: 100%; padding: 15px; font-size: 1.15rem; text-align: center; border-radius: 10px; border: 2px solid var(--border); }
        .subjective-input:focus { border-color: var(--primary); }
        .submit-btn { padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .submit-btn:hover { background: var(--primary-hover); }

        .quiz-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; }
        .nav-btn { padding: 11px 15px; background: #52706d; color: white; border: none; border-radius: 9px; cursor: pointer; font-size: 0.88rem; font-weight: 700; transition: background 0.2s; }
        .nav-btn:hover { background: #475569; }
        
        .result-text { font-size: 1.2rem; font-weight: 700; margin-top: 15px; min-height: 30px; }
        .result-text.success { color: var(--success); }
        .result-text.error { color: var(--error); }

        @media (max-width: 640px) {
            body { padding: 22px 12px 32px; }
            header { margin-bottom: 22px; }
            header h1 { font-size: 1.85rem; }
            .tabs { overflow-x: auto; }
            .tab-btn { flex: 0 0 auto; white-space: nowrap; font-size: 0.84rem; padding-inline: 12px; }
            .filter-section { grid-template-columns: 1fr 1fr; gap: 8px; }
            .search-input { grid-column: 1 / -1; }
            .word-list { grid-template-columns: 1fr; gap: 10px; }
            .word-card { padding: 16px; }
            .quiz-card { padding: 24px 16px; }
            .quiz-options { grid-template-columns: 1fr; gap: 9px; }
            .quiz-nav { flex-direction: column-reverse; }
            .nav-btn { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ 스마트 영단어장 & 퀴즈 보드</h1>
        <p>CSV 비동기 로드 기반 초경량 영단어 마스터 웹 앱</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-list')">📋 단어장 보기</button>
        <button class="tab-btn" onclick="switchTab('tab-choice')">🎯 객관식 테스트</button>
        <button class="tab-btn" onclick="switchTab('tab-write')">✍️ 주관식 테스트</button>
    </div>

    <!-- 필터링 제어 영역 -->
    <div class="filter-section">
        <select id="day-filter" onchange="handleFilterChange()">
            <option value="ALL">전체 DAY 선택</option>
        </select>
        <select id="level-filter" onchange="handleFilterChange()">
            <option value="ALL">전체 난이도</option>
            <option value="Normal">Normal</option>
            <option value="Hard">Hard</option>
        </select>
        <input type="text" id="search-bar" class="search-input" placeholder="단어 또는 뜻 검색..." oninput="handleFilterChange()">
    </div>

    <!-- 1. 단어장 보기 패널 -->
    <div id="tab-list" class="view-panel active">
        <div class="word-list" id="word-list-container">
            <!-- 자바스크립트로 데이터 주입 -->
        </div>
    </div>

    <!-- 2. 객관식 퀴즈 패널 -->
    <div id="tab-choice" class="view-panel">
        <div class="quiz-card">
            <div class="quiz-progress" id="choice-progress">0 / 0</div>
            <div class="quiz-question" id="choice-question">단어 원문</div>
            <div class="quiz-options" id="choice-options"></div>
            <div class="result-text" id="choice-result"></div>
            <div class="quiz-nav">
                <button class="nav-btn" onclick="initChoiceQuiz()">🔄 퀴즈 다시 생성</button>
                <button class="nav-btn" id="choice-next-btn" onclick="nextChoiceQuestion()" style="background-color: var(--primary);">다음 문제 ➡️</button>
            </div>
        </div>
    </div>

    <!-- 3. 주관식 퀴즈 패널 -->
    <div id="tab-write" class="view-panel">
        <div class="quiz-card">
            <div class="quiz-progress" id="write-progress">0 / 0</div>
            <div class="quiz-question" id="write-question">뜻이 화면에 노출됨</div>
            <div class="subjective-container">
                <input type="text" id="write-input" class="subjective-input" placeholder="영단어를 입력하세요" autocomplete="off" onkeyup="if(window.event.keyCode==13){checkWriteAnswer()}">
                <button class="submit-btn" onclick="checkWriteAnswer()">정답 확인</button>
            </div>
            <div class="result-text" id="write-result"></div>
            <div class="quiz-nav">
                <button class="nav-btn" onclick="initWriteQuiz()">🔄 퀴즈 다시 생성</button>
                <button class="nav-btn" id="write-next-btn" onclick="nextWriteQuestion()" style="background-color: var(--primary);">다음 문제 ➡️</button>
            </div>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
